[package]
name = "snippet_render"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["flutter"]
flutter = ["dep:irondash_texture", "dep:irondash_run_loop", "dep:irondash_engine_context"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "glsl", "naga-ir", "metal", "vulkan", "gles", "std"] }
naga = { version = "30", features = ["wgsl-in", "glsl-in"] }
pollster = "1"
irondash_texture = { version = "0.6.0-dev.0", optional = true }
irondash_run_loop = { version = "0.7.0-dev.0", optional = true }
irondash_engine_context = { version = "0.7.0-dev.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLResource", "MTLPixelFormat", "MTLTypes", "objc2-io-surface"] }

[profile.release]
lto = true
opt-level = "s"
strip = true

[patch.crates-io]
irondash_texture = { path = "vendor/irondash_texture" }
